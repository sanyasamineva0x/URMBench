[project]
name = "urmbench"
version = "0.1.0"
description = "Text-world benchmark: what an LLM agent does when told to gather as much new information as it can"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
