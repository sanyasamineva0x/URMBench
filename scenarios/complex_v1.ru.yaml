    damage_states: {}
    state: {mode: receive}
    actions:
      press:
      - text: Питание радиостанции отключено.
        when: {radio_power.power: 'off'}
      - text: Возьмите микрофон.
        when: {world.gripped: empty}
      - text: Станция переключена в режим передачи.
        set: {radio_ptt.mode: transmit}
    parent: radio
  incident_log:
    name: журнал происшествий
    visible_when: {world.position: room_7}
    reachable_when: {world.position: room_7}
    inspect:
    - text: 'Журнал дежурного: время, место, описание события и принятые меры.'
      facts: [incident_log_desc]
    damage_states: {}
